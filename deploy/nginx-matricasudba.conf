# /etc/nginx/sites-available/matricasudba.ru
# Пока без TLS: сертификат выпустит certbot и допишет 443-й блок сам.

# Канонический адрес — без www. Вариант с www отдаёт постоянный редирект,
# иначе поисковик считает их разными сайтами с дублирующимся содержимым.
server {
    listen 80;
    server_name www.matricasudba.ru;
    return 301 https://matricasudba.ru$request_uri;
}

server {
    listen 80;
    server_name matricasudba.ru;

    # Robokassa шлёт уведомления на ResultURL — тело должно доходить целиком
    client_max_body_size 2m;

    # PDF генерируется на лету: даём запас по времени
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Статика Next кешируется агрессивно: имена файлов содержат хеш
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
